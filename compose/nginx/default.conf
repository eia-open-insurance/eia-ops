# Shell reverse proxy for the local container and Kubernetes deployments.
# /api is forwarded to the gateway; /remotes/<vertical>/ is forwarded to the matching
# federated web remote with the prefix stripped, so remoteEntry.js and every Webpack
# chunk resolve from the remote's nginx root. Unknown paths fall back to the SPA entry
# point. Kubernetes Ingress applies the equivalent rewrite; this proxy keeps
# `kubectl port-forward svc/eia-shell` (and Compose on port 3000) working unchanged.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://eia-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Federated web remotes (Module Federation). The URI part on proxy_pass ("/")
    # replaces the matched /remotes/<vertical>/ prefix.
    location /remotes/party/ {
        proxy_pass http://eia-party-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/policy/ {
        proxy_pass http://eia-policy-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/contract/ {
        proxy_pass http://eia-contract-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/direct-claims/ {
        proxy_pass http://eia-direct-claims-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/assumed-claims/ {
        proxy_pass http://eia-assumed-claims-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/cession/ {
        proxy_pass http://eia-cession-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/retrocession/ {
        proxy_pass http://eia-retrocession-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/document/ {
        proxy_pass http://eia-document-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/payment/ {
        proxy_pass http://eia-payment-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /remotes/notifications/ {
        proxy_pass http://eia-notifications-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
