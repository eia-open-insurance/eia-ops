# EIA Open Insurance - local container stack.
#
# Scope: PostgreSQL, gateway, auth, config, lineage, shell, the 20 implemented vertical
# services (10 domain services + 10 expert services), the 10 federated web remotes, and
# the FS-RI simulator test double (SPEC 15.3). The shell proxies /remotes/<vertical>/
# to the web remotes, matching the Kubernetes Ingress rewrite.
#
# Local-only values. Copy .env.example to .env before changing credentials.
name: eia-local

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: "-Xms32m -Xmx256m -XX:+UseSerialGC"

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  networks:
    - eia

networks:
  eia:
    name: eia-local

volumes:
  postgres-data:
    name: eia-local-postgres-data

services:
  eia-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - eia
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me-local-only}
      POSTGRES_DB: eia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 20

  eia-gateway:
    <<: *java-service
    image: eia/gateway:${EIA_TAG:-local}
    build:
      context: ../../eia-platform/gateway
      dockerfile: ../../eia-ops/images/platform/gateway.Dockerfile
    environment:
      <<: *java-environment
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
    volumes:
      - ./config/gateway/application.yml:/app/config/application.yml:ro
    ports:
      - "8080:8080"

  eia-auth:
    <<: *java-service
    image: eia/auth:${EIA_TAG:-local}
    build:
      context: ../../eia-platform/auth
      dockerfile: ../../eia-ops/images/platform/auth.Dockerfile
    environment:
      <<: *java-environment
    ports:
      - "9000:9000"

  eia-config:
    <<: *java-service
    image: eia/config:${EIA_TAG:-local}
    build:
      context: ../../eia-platform/config
      dockerfile: ../../eia-ops/images/platform/config.Dockerfile
    environment:
      <<: *java-environment
    volumes:
      - ./config/server:/app/config:ro
    ports:
      - "8888:8888"

  eia-lineage:
    <<: *java-service
    image: eia/lineage:${EIA_TAG:-local}
    build:
      context: ../../eia-platform/lineage
      dockerfile: ../../eia-ops/images/platform/lineage.Dockerfile
    environment:
      <<: *java-environment
    ports:
      - "8101:8101"

  eia-party-expert:
    <<: *java-service
    image: eia/party-expert:${EIA_TAG:-local}
    build:
      context: ../../eia-party-expert
      dockerfile: ../eia-ops/images/verticals/party-expert.Dockerfile
    environment:
      <<: *java-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://eia-postgres:5432/eia_party
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-eia}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-replace-me-local-only}
      SPRING_SQL_INIT_MODE: always
    depends_on:
      eia-postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  eia-party-domain:
    <<: *java-service
    image: eia/party-domain:${EIA_TAG:-local}
    build:
      context: ../../eia-party-domain
      dockerfile: ../eia-ops/images/verticals/party-domain.Dockerfile
    environment:
      <<: *java-environment
      SPRING_APPLICATION_JSON: '{"eia":{"party":{"expert-url":"http://eia-party-expert:8081"}}}'
    depends_on:
      eia-party-expert:
        condition: service_started
    ports:
      - "8082:8082"

  eia-policy-expert:
    <<: *java-service
