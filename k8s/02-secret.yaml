# Local placeholder only. Replace before any shared or non-local deployment.
# Do not commit a real credential. See ../README.md ("Secrets").
apiVersion: v1
kind: Secret
metadata:
  name: eia-db
  namespace: eia-local
  labels:
    app.kubernetes.io/part-of: eia-open-insurance
type: Opaque
stringData:
  POSTGRES_USER: eia
