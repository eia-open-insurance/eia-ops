# EIA Open Insurance - federated web remotes (one Deployment + Service per vertical).
# Each image is built by repos/eia-ops/images/web/remote.Dockerfile from the owning
# repos/eia-<vertical>-web dist/ output and serves the bundle on port 80.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-party-web
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-party-web
    app.kubernetes.io/component: web-remote
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-party-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-party-web
        app.kubernetes.io/component: web-remote
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-web
          image: eia/party-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eia-party-web
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-party-web
    app.kubernetes.io/component: web-remote
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-party-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
