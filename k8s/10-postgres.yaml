apiVersion: v1
kind: ConfigMap
metadata:
  name: eia-postgres-initdb
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eia-open-insurance
data:
  01-create-databases.sh: |-
    #!/bin/sh
    # One PostgreSQL cluster for local deployment; each expert service owns its database.
    # Runs once, from the official postgres image entrypoint, when the data volume is empty.
    # POSTGRES_USER (the superuser created by the image) owns every database.
    set -eu

    for db in \
      eia_party \
      eia_policy \
      eia_contract \
      eia_direct \
      eia_assumed \
      eia_cession \
      eia_retrocession \
      eia_document \
      eia_payment \
      eia_notifications \
      eia_platform
    do
      echo "creating database ${db}"
      psql --username "${POSTGRES_USER}" --dbname postgres --set ON_ERROR_STOP=1 \
        --command "CREATE DATABASE ${db} OWNER \"${POSTGRES_USER}\";"
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eia-postgres-data
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-postgres
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eia-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eia-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: eia
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eia-postgres-data
        - name: initdb
          configMap:
            name: eia-postgres-initdb
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: eia-postgres
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
