apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eia
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia
    app.kubernetes.io/part-of: eia-open-insurance
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  rules:
    - host: eia.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eia-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eia-shell
                port:
                  number: 80
