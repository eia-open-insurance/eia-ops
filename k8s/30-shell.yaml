apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-shell
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-shell
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-shell
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shell
          image: eia/shell:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: eia-shell-config
---
apiVersion: v1
kind: Service
metadata:
  name: eia-shell
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-shell
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-shell
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
