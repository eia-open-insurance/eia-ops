apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-gateway
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-gateway
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-gateway
        app.kubernetes.io/component: platform
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: eia/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms32m -Xmx256m -XX:+UseSerialGC"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gateway-config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gateway-config
          configMap:
            name: eia-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: eia-gateway
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-gateway
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
