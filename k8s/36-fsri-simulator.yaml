# FS-RI simulator (eia-quality test double, SPEC 15.3 / 7.23.5).
# The image is built from repos/eia-quality by the deployment-owned Dockerfile
# images/simulators/fsri.Dockerfile and listens on its native port 8181.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-fsri-simulator
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-fsri-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-fsri-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-fsri-simulator
        app.kubernetes.io/component: simulator
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fsri-simulator
          image: eia/fsri-simulator:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8181"
            - name: SIM_ENV
              value: "test"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /sim/fsri/health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /sim/fsri/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /sim/fsri/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eia-fsri-simulator
  namespace: eia-local
  labels:
    app.kubernetes.io/name: eia-fsri-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: eia-open-insurance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-fsri-simulator
  ports:
    - name: http
      port: 8181
      targetPort: http
      protocol: TCP
