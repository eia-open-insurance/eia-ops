{{- range $vertical, $web := .Values.web }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-{{ $vertical }}-web
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-{{ $vertical }}-web
    app.kubernetes.io/component: web-remote
    {{- include "eia.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-{{ $vertical }}-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-{{ $vertical }}-web
        app.kubernetes.io/component: web-remote
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $vertical }}-web
          image: {{ include "eia.image" (dict "root" $ "image" $web.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $web.port }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eia-{{ $vertical }}-web
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-{{ $vertical }}-web
    app.kubernetes.io/component: web-remote
    {{- include "eia.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-{{ $vertical }}-web
  ports:
    - name: http
      port: {{ $web.port }}
      targetPort: http
      protocol: TCP
{{- end }}
