{{- $dbSecret := include "eia.dbSecretName" . -}}
{{- if not .Values.postgres.auth.existingSecret }}
# Local placeholder only. Override postgres.auth.password or set postgres.auth.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eia.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
{{- if not .Values.eventSigning.existingSecret }}
---
# Shared HMAC-SHA256 secret for outbox -> event-ingest delivery (SPEC 7.5.1).
# Local placeholder only; override eventSigning.secret or set eventSigning.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eia.eventSigningSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-event-ingest
    app.kubernetes.io/component: platform
    {{- include "eia.labels" . | nindent 4 }}
type: Opaque
stringData:
  EIA_EVENT_SIGNING_SECRET: {{ .Values.eventSigning.secret | quote }}
{{- end }}
