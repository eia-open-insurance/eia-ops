{{- $dbSecret := include "eia.dbSecretName" . -}}
{{- if not .Values.postgres.auth.existingSecret }}
# Local placeholder only. Override postgres.auth.password or set postgres.auth.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eia.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
