apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-shell
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-shell
    app.kubernetes.io/component: frontend
    {{- include "eia.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-shell
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shell
          image: {{ include "eia.image" (dict "root" . "image" .Values.shell.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.shell.port }}
          resources:
{{ toYaml .Values.shell.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: eia-shell-config
---
apiVersion: v1
kind: Service
metadata:
  name: eia-shell
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-shell
    app.kubernetes.io/component: frontend
    {{- include "eia.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-shell
  ports:
    - name: http
      port: {{ .Values.shell.port }}
      targetPort: http
      protocol: TCP
