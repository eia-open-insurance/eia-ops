apiVersion: v1
kind: ConfigMap
metadata:
  name: eia-gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-gateway
    app.kubernetes.io/component: platform
    {{- include "eia.labels" . | nindent 4 }}
data:
  application.yml: |-
{{ .Files.Get "files/gateway-application.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eia-config-server-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-config
    app.kubernetes.io/component: platform
    {{- include "eia.labels" . | nindent 4 }}
data:
  application.yml: |-
{{ .Files.Get "files/config-server-application.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eia-shell-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-shell
    app.kubernetes.io/component: frontend
    {{- include "eia.labels" . | nindent 4 }}
data:
  default.conf: |-
{{ .Files.Get "files/shell-default.conf" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eia-postgres-initdb
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-postgres
    app.kubernetes.io/component: database
    {{- include "eia.labels" . | nindent 4 }}
data:
  01-create-databases.sh: |-
{{ .Files.Get "files/postgres-initdb.sh" | indent 4 }}
