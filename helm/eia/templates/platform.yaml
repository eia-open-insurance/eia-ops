{{- $dbSecret := include "eia.dbSecretName" . -}}
{{- range $name, $service := .Values.platform }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-{{ $name }}
    app.kubernetes.io/component: platform
    {{- include "eia.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: eia-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eia-{{ $name }}
        app.kubernetes.io/component: platform
        app.kubernetes.io/part-of: eia-open-insurance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "eia.image" (dict "root" $ "image" $service.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.global.javaToolOptions | quote }}
{{- if eq $name "event-ingest" }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:postgresql://eia-postgres:%d/%s" (int $.Values.postgres.servicePort) $service.database | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: POSTGRES_PASSWORD
            - name: SPRING_SQL_INIT_MODE
              value: "always"
            - name: EIA_EVENT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eia.eventSigningSecretName" $ }}
                  key: EIA_EVENT_SIGNING_SECRET
{{- end }}
{{- if eq $name "gateway" }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/"
{{- end }}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{{- if eq $name "gateway" }}
            - name: gateway-config
              mountPath: /app/config/application.yml
              subPath: application.yml
              readOnly: true
{{- end }}
{{- if eq $name "config" }}
            - name: config-server
              mountPath: /app/config
              readOnly: true
{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if eq $name "gateway" }}
        - name: gateway-config
          configMap:
            name: eia-gateway-config
{{- end }}
{{- if eq $name "config" }}
        - name: config-server
          configMap:
            name: eia-config-server-config
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: eia-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: eia-{{ $name }}
    app.kubernetes.io/component: platform
    {{- include "eia.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eia-{{ $name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
